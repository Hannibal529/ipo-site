<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>IPO 트래커</title>
<style>
:root{--bg:#f4f4f1;--surface:#fdfdfc;--line:#e4e3de;--ink:#0b0b0b;--ink2:#38465a;--ink3:#56657a;
--accent:#2a78d6;--accent-soft:#e8f1fc;--up:#c8341f;--down:#1f6fc8;--warn:#9a6a00;--warn-bg:#fff6dc;
--ev-fc:#2a78d6;--ev-sub:#d4671a;--ev-list:#1b8a5a;--ev-pay:#7a5bc7;--ev-lock:#8a8984;--top:#15171a;--top-ink:#f3f3f0}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--surface:#1a1a19;--line:#2e2e2c;--ink:#f0efec;--ink2:#c6cfdc;--ink3:#9ba7b9;
--accent:#3987e5;--accent-soft:#1d2a3b;--warn:#f2c14e;--warn-bg:#2d2614;--ev-fc:#3987e5;--ev-sub:#e5853f;--ev-list:#3aa775;--ev-pay:#9b80e0;--up:#ef6a55;--down:#5b9cf0;--top:#0c0d0e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.topbar{position:sticky;top:0;z-index:4;background:var(--top);color:var(--top-ink)}
.topin{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:22px;padding:0 24px;height:52px}
.logo{font-weight:700;font-size:16px;letter-spacing:-.3px;white-space:nowrap;cursor:pointer}
.logo i{font-style:normal;color:#8fb8f0}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{background:none;border:0;padding:8px 12px;font:inherit;color:#b9b9b4;cursor:pointer;border-radius:6px;white-space:nowrap}
nav button:hover{color:#fff}
nav button.on{color:#fff;background:rgba(255,255,255,.12);font-weight:600}
.upd{margin-left:auto;font-size:12px;color:#9a9a95;white-space:nowrap}
main{max-width:1240px;margin:0 auto;padding:22px 24px 40px}
.meta{color:var(--ink3);font-size:12px}
.warns{max-width:1192px;margin:12px auto 0;padding:8px 12px;background:var(--warn-bg);color:var(--warn);border-radius:6px;font-size:12px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.bar label{color:var(--ink2);font-size:13px;display:flex;gap:4px;align-items:center}
.bar input[type=search]{padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;width:200px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:auto}
table{border-collapse:collapse;width:100%;white-space:nowrap}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line)}
th{font-weight:500;color:var(--ink2);font-size:12px;position:sticky;top:0;background:var(--surface);cursor:pointer;user-select:none}
th:first-child,td:first-child,.l{text-align:left}
tbody tr:hover{background:var(--accent-soft)}
tbody tr.click{cursor:pointer}
.tag{display:inline-block;font-size:11px;line-height:16px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--ink2);margin-right:4px;white-space:nowrap}
.tag.b{border-color:transparent;background:var(--bg)}
.st{font-size:12px;color:var(--ink2)}
.pos{color:var(--up)}.neg{color:var(--down)}.mute{color:var(--ink3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.chart{padding:14px 16px}
.chart h3{margin:0 0 2px;font-size:14px}.chart p{margin:0 0 8px;color:var(--ink3);font-size:12px}
svg text{fill:var(--ink2);font-size:11px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);padding:6px 8px;border-radius:6px;font-size:12px;display:none;z-index:9}
/* home */
.sec{margin:28px 0 10px;display:flex;align-items:baseline;gap:10px}
.sec h2{margin:0;font-size:17px;letter-spacing:-.3px}
.sec a{margin-left:auto;font-size:13px;cursor:pointer}
.today{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.today .hd{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.today .hd b{font-size:20px;letter-spacing:-.4px}
.trow{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.trow:first-of-type{border-top:0}
.trow:hover .tn{text-decoration:underline}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;color:#fff;background:var(--c);text-align:center;white-space:nowrap}
.tn{font-weight:600;font-size:15px}
.ts{font-size:12px;color:var(--ink2)}
.tv{text-align:right;font-size:13px;white-space:nowrap}
.empty{color:var(--ink3);padding:6px 0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-size:12px;color:var(--ink2);font-weight:500}
.kpi strong{display:block;font-size:22px;letter-spacing:-.5px;margin:2px 0}
.kpi span{font-size:12px;color:var(--ink3)}
.week{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.week .c{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 6px 8px;min-height:92px;min-width:0}
.week .c:nth-child(5n){border-right:0}
.week .c.t{background:var(--accent-soft)}
.week .c.p{background:var(--bg)}
.week .dh{font-size:12px;color:var(--ink2);margin-bottom:4px}
.week .c.t .dh{font-weight:700;color:var(--accent)}
@media(max-width:700px){.week{grid-template-columns:1fr}.week .c{border-right:0;min-height:0}}
.chip{display:block;font-size:11.5px;padding:2px 6px;margin:3px 0;border-radius:4px;border-left:3px solid var(--c);background:var(--bg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.week .c.t .chip{background:var(--surface)}
.chip.mid{opacity:.55}
.chip em{font-style:normal;color:var(--ink3);margin-right:3px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.ipo{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:10px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:box-shadow .15s}
.ipo:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.ipo .top{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.ipo .top .pill{margin-right:4px}
.ipo .nm{font-size:17px;font-weight:700;letter-spacing:-.3px;line-height:1.3}
.ipo .nm span{font-size:12px;font-weight:400;color:var(--ink3);margin-left:6px}
.ipo .sch{font-size:12px;color:var(--ink2)}
.ipo .sch .on{color:var(--c);font-weight:600}
.px{display:grid;grid-template-columns:1fr 1fr 1.2fr;background:var(--bg);border-radius:8px;padding:8px 10px;gap:6px}
.px b{display:block;font-size:11px;color:var(--ink3);font-weight:500}
.px div{font-size:13px}
.px strong{font-size:15px}
.opn{font-size:13px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.opn>b{font-size:11px;color:var(--ink3);font-weight:500;margin-right:2px}
.mx{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.mx b{font-weight:500;color:var(--ink3);margin-right:3px}
.recent td,.recent th{padding:7px 10px}
@media(max-width:700px){.upd{display:none}.topin{gap:10px;padding:0 12px}main{padding:16px 12px 32px}
.today{padding:14px}.trow{grid-template-columns:70px 1fr;gap:4px 10px}.trow .tv{grid-column:2;text-align:left}
.pill{font-size:11px;padding:3px 6px}.sec{flex-wrap:wrap}.sec .legend{order:3;width:100%}.px{padding:8px}}
.foot{max-width:1240px;margin:0 auto;padding:0 24px 30px;color:var(--ink3);font-size:12px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(5,1fr);border-left:1px solid var(--line);border-top:1px solid var(--line);background:var(--surface)}
.cal div.h{padding:6px;font-size:12px;color:var(--ink2);border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
.cal .d{min-height:104px;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px;min-width:0}
.cal .d.o{background:var(--bg);color:var(--ink3)}
.cal .d.hol{background:#fdf0ef}.cal .d.hol .n,.cal .hn{color:#d03b3b;font-weight:700}.cal .hn{font-size:11px;margin-left:4px}.cal .d.kx .n,.cal .d.kx .hn{color:var(--ink3)}
.cal .d.t .n{background:var(--ink);color:var(--surface);border-radius:10px;padding:0 6px}
.cal .n{font-size:11px;color:var(--ink2);margin-bottom:2px;display:inline-block}
.ag{display:none}
.ag .day{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:8px 12px;scroll-margin-top:70px}
.ag .day.p{opacity:.6}.ag .day.t{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ag .dh{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:2px}
.ag .tg{background:var(--ink);color:var(--surface);border-radius:8px;padding:0 6px;font-size:11px;margin-left:4px}
.ag .hn{color:#d03b3b;font-size:12px;margin-left:4px}.ag .hn.kx{color:var(--ink3)}
.ag .e{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.35;cursor:pointer}
.ag .e:first-of-type{border-top:0}
.ag .e em{font-style:normal;font-size:12px;color:var(--ink2);flex:0 0 58px;border-left:3px solid var(--c);padding-left:6px}
.ag .e .rg{color:var(--ink3);font-size:12px;margin-left:2px}.ag .e.none{color:var(--ink3);cursor:default}
@media(max-width:700px){.cal{display:none}.ag{display:block}}
.ev{display:block;font-size:11px;padding:1px 4px;margin:2px 0;border-radius:3px;border-left:3px solid;background:var(--bg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--c)}
/* drawer */
.drawer{position:fixed;top:0;right:0;width:min(760px,100%);height:100%;background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.08);transform:translateX(100%);transition:transform .2s;overflow:auto;z-index:6;padding:22px 26px}
.drawer.on{transform:none}
.drawer h2{margin:0 0 4px;font-size:21px}
.drawer h4{margin:22px 0 8px;font-size:13px;color:var(--ink2)}
.drawer ul{margin:0;padding-left:18px}.drawer li{margin:3px 0}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kv div{background:var(--bg);border-radius:6px;padding:8px 10px}
.kv b{display:block;font-size:11px;color:var(--ink3);font-weight:500}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grades div{background:var(--bg);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--ink2)}
.grades b{display:block;font-size:11px;color:var(--ink3);font-weight:500}
.grades strong{font-size:14px;color:var(--ink);margin-right:4px}
.x{position:absolute;right:18px;top:16px;border:0;background:none;font-size:22px;color:var(--ink2);cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 10px;border-radius:6px;cursor:pointer;font:inherit;text-decoration:none;display:inline-block}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
a{color:var(--accent)}
.note{font-size:12px;color:var(--ink2);background:var(--bg);border-radius:6px;padding:8px 10px;margin-top:8px}
.lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.lock[hidden]{display:none}
.lock form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 26px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
.lock .lt{font-size:20px;font-weight:700}.lock .lt i{font-style:normal;color:var(--accent)}
.lock p{margin:0;font-size:13px;color:var(--ink2)}
.lock input[type=password]{font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.lock label{font-size:13px;color:var(--ink2)}
.lock .btn{padding:10px;font-size:15px}
.lock .msg{font-size:13px;color:#d03b3b;min-height:18px}
.upd .lo{margin-left:10px;cursor:pointer;color:var(--ink3);text-decoration:underline}
.ev.wd,.e.wd{text-decoration:line-through;opacity:.55}
</style>
</head>
<body>
<div class="topbar"><div class="topin"><span class="logo" data-k="home">IPO <i>트래커</i></span><nav id="tabs"></nav><span class="upd" id="upd"></span></div></div>
<div class="lock" id="lock" hidden><form id="lockf" autocomplete="on"><div class="lt">IPO <i>트래커</i></div>
<p>팀 내부용 페이지입니다. 비밀번호를 입력하세요.</p>
<input type="password" id="pw" autocomplete="current-password" placeholder="비밀번호">
<label><input type="checkbox" id="rem" checked> 이 기기에서 기억</label>
<button class="btn pri" type="submit">열기</button><div class="msg" id="lockmsg"></div></form></div>
<div id="warns"></div>
<main id="main"></main>
<div class="foot">팀 내부 참고용 · 신고서·공개 시세 기반 산정치이며 투자 판단의 근거가 아님 · 출처 DART OpenAPI, 38커뮤니케이션, 네이버 증권</div>
<aside class="drawer" id="drawer"></aside>
<div class="tip" id="tip"></div>
<script>
const TABS=[["home","홈"],["pipe","공모 예정"],["cal","캘린더"],["dem","수요예측 추이"],["lock","보호예수 해제"],["post","상장 후 저평가"],["val","적정가 검증"],["model","예측 검증"]];
let D,tab="home",calM=null;
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const _n=new Date(),today=`${_n.getFullYear()}-${pad(_n.getMonth()+1)}-${pad(_n.getDate())}`;
const fmt=(v,d=0)=>v==null||v===""||isNaN(v)?"–":Number(v).toLocaleString("ko-KR",{maximumFractionDigits:d,minimumFractionDigits:d});
const pct=(v,d=1)=>v==null||isNaN(v)?"–":(v*100).toFixed(d)+"%";
const sgn=(v,d=1)=>v==null||isNaN(v)?"–":(v>0?"+":"")+(v*100).toFixed(d)+"%";
const md=s=>s?(+s.slice(5,7))+"/"+(+s.slice(8,10)):"–";
const rng=a=>!a||!a.length||!a[0]?"–":a[0]===a[1]?md(a[0]):md(a[0])+"~"+(a[0].slice(5,7)===a[1].slice(5,7)?+a[1].slice(8,10):md(a[1]));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=s=>{const m=String(s??"").replace(/,/g,"").match(/[\d.]+/);return m?+m[0]:null};
const U=s=>new Date(s+"T00:00:00Z");
const addD=(s,n)=>{const d=U(s);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const dow=s=>U(s).getUTCDay();
const WK="일월화수목금토";
const dday=s=>Math.round((U(s)-U(today))/864e5);
const EV={fc:["수요예측","var(--ev-fc)"],sub:["청약","var(--ev-sub)"],pay:["납입","var(--ev-pay)"],list:["상장","var(--ev-list)"],lock:["확약해제","var(--ev-lock)"],wd:["철회","var(--up)"]};

function status(p){
  if(p.listing&&p.listing<=today)return["상장완료",5];
  if(p.payment&&p.payment<=today)return["상장대기",4];
  if(p.subscription&&p.subscription[0]<=today)return p.subscription[1]>=today?["청약중",3]:["상장대기",4];
  if(p.forecast&&p.forecast[0]<=today)return p.forecast[1]>=today?["수요예측중",2]:["청약대기",2.5];
  return["신고서 제출",1];
}
/* 지금 단계(진행 중) 또는 다음 단계 */
function stage(p){
  const L=[["fc",p.forecast],["sub",p.subscription],["pay",p.payment&&[p.payment,p.payment]],["list",p.listing&&[p.listing,p.listing]]];
  if(!L.some(x=>x[1]&&x[1][0]))return{k:"filed",l:"신고서 제출",c:"var(--ink3)"};
  for(const [k,r] of L){if(!r||!r[0])continue;if(r[1]>=today)return{k,l:EV[k][0],c:EV[k][1],s:r[0],e:r[1],live:r[0]<=today}}
  return{k:"done",l:"상장 완료",c:"var(--ink3)",s:p.listing};
}
function badge(st){
  if(st.k==="done"||st.k==="filed")return st.l;
  if(st.live)return st.s===st.e?`${st.l} 오늘`:st.e===today?`${st.l} 마감일`:`${st.l} 중`;
  return `${st.l} D-${dday(st.s)}`;
}
/* 재산정 적정가와 기준가(확정가 또는 밴드 상단) 대비 */
function upside(p){const v=(p.our_valuation||{}).value;const base=p.final_price||(p.band&&p.band[1]);return v&&base?{v,base,r:v/base-1,lab:p.final_price?"확정가 대비":"밴드상단 대비"}:null}
function tags(p){
  const t=[];if(p.spac)t.push("스팩");if(p.market)t.push(p.market);if(p.special)t.push("기술특례");if(p.bio)t.push("바이오");
  const f=p.fin||{},op=(f.rows||{})["영업이익"];
  if(op&&f.cols){const i=f.cols.findIndex(c=>/^\d{4}$/.test(c));if(i>=0&&op[i]!=null)t.push(op[i]>0?"영업흑자":"영업적자")}
  if(p.sale_shares>0&&p.shares_offered)t.push("구주매출 "+Math.round(p.sale_shares/p.shares_offered*100)+"%");
  return t;
}
// 재산정에 남은 비교기업이 1곳 이하면 그 한 회사 이익 변동에 크게 흔들림 → 신뢰도 낮음
// 추정이익 달성률(참고): 실적 기준 보수값 = 당사 적정가 × 과거 상장 이듬해 매출 달성률, 주관사 과거 추정 기록
function estRef(p){const E=D.est_achieve||{},v=p.our_valuation||{};if(v.rate_base==null||!v.value||!E.factor)return null;
  const u=(p.underwriter||"").split(/[,/·]/)[0].trim(),d=(E.by_uw||{})[u];
  const rec=d&&(d.n_rev>=3||d.prof_est>=3)?`${u} 과거 추정 기록: ${d.prof_est?`영업흑자 추정 ${d.prof_est}건 중 실제 흑자 ${d.prof_act}건`:""}${d.prof_est&&d.rev_med!=null?", ":""}${d.rev_med!=null?`매출 달성률 중앙 ${Math.round(d.rev_med*100)}%(${d.n_rev}건)`:""}`:null;
  return {cons:Math.round(v.value*E.factor),f:E.factor,rec}}
// 보수적 적정가: 최고 배수 비교기업 1곳 제외 (밸류 민감도의 기본 할인율 행)
// 최고 배수가 나머지 비교기업 중앙값보다 50% 이상 높을 때만(비교기업 3곳 이상) 이상치로 보고 제외값을 보여 줌
const EX_TOP_GAP=1.5;
function topGap(v){const m=v.method,ks=(v.peers||[]).filter(q=>q.kept&&q.multiples&&q.multiples[m]>0).map(q=>q.multiples[m]).sort((a,b)=>b-a);
  if(ks.length<3)return null;const r=ks.slice(1),md=r.length%2?r[(r.length-1)/2]:(r[r.length/2-1]+r[r.length/2])/2;return md>0?ks[0]/md:null}
function exTop(p){const v=p.our_valuation||{};if(!v.value||!v.top_peer)return null;const g=topGap(v);if(!g||g<EX_TOP_GAP)return null;
  const r=(v.sens||[]).find(x=>x.rate===v.rate_base)||null;if(!r||!r.ex_top||r.ex_top>=v.value)return null;
  const peer=(v.top_peer.match(/\(([^)]+)\)\s*$/)||[])[1]||v.top_peer;const base=p.final_price||(p.band&&p.band[1]);
  return{v:r.ex_top,peer,g,r:base?r.ex_top/base-1:null}}

function bandPos(p){const b=p.band,f=p.final_price;if(!f||!b||!b[1])return null;

  return{txt:`밴드 ${fmt(b[0])}~${fmt(b[1])}원 · ${t}`,short:t}}

/* ---------- 비밀번호 잠금 (공개 사이트는 데이터·PDF가 암호화돼 있음, key.json 이 있을 때만 동작) ---------- */
const SEC={key:null};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e=u=>btoa(String.fromCharCode(...u));
async function aesKey(raw){return crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"])}
async function dec(key,buf){const u=new Uint8Array(buf);return crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(0,12)},key,u.slice(12))}
async function getEnc(path){const r=await fetch(path+".enc",{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return dec(SEC.key,await r.arrayBuffer())}
async function tryKey(raw,km){try{const k=await aesKey(raw);await dec(k,b64d(km.check));return k}catch(e){return null}}
async function unlock(km){
  const LS="ipo_site_key";
  let saved=null;try{saved=localStorage.getItem(LS)}catch(e){}
  if(saved){SEC.key=await tryKey(b64d(saved),km);if(SEC.key)return}
  $("#lock").hidden=false;setTimeout(()=>$("#pw").focus(),50);
  await new Promise(done=>{$("#lockf").onsubmit=async e=>{e.preventDefault();
    const pw=$("#pw").value;if(!pw)return;$("#lockmsg").textContent="확인 중…";
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
    const raw=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64d(km.salt),iterations:km.iter,hash:"SHA-256"},base,256));
    const k=await tryKey(raw,km);
    if(!k){$("#lockmsg").textContent="비밀번호가 맞지 않습니다.";$("#pw").select();return}
    SEC.key=k;try{if($("#rem").checked)localStorage.setItem(LS,b64e(raw));else localStorage.removeItem(LS)}catch(e){}
    $("#lock").hidden=true;$("#pw").value="";done()}});
}
// 암호화된 PDF: 클릭하면 받아서 풀고 열기(또는 내려받기)
document.addEventListener("click",async e=>{
  const a=e.target.closest('a[href^="reports/"]');if(!a||!SEC.key)return;
  e.preventDefault();e.stopPropagation();
  const name=a.getAttribute("download"),w=name?null:window.open("","_blank");
  try{const url=URL.createObjectURL(new Blob([await getEnc(a.getAttribute("href"))],{type:"application/pdf"}));
    if(name){const t=document.createElement("a");t.href=url;t.download=name;document.body.appendChild(t);t.click();t.remove()}
    else if(w)w.location=url;else location.href=url;
  }catch(err){if(w)w.close();alert("PDF를 열지 못했습니다: "+err.message)}
},true);

  D.pipeline.forEach(p=>{span(p.forecast,"fc",p);span(p.subscription,"sub",p);if(p.payment)ev.push({d:p.payment,t:"pay",n:p.name,pos:"one"});if(p.listing)ev.push({d:p.listing,t:"list",n:p.name,pos:"one",lab:p.open_actual?`${p.name} ${sgn(p.open_actual.ret,0)}`:null})});
  (D.lockups||[]).forEach(l=>(l.releases||[]).forEach(r=>r.date&&ev.push({d:r.date,t:"lock",n:l.name,lab:`${l.name} ${r.period} ${pct(r.ratio)}`,pos:"one",r})));
  (D.past_ipos||[]).forEach(h=>{const P={name:h.name};
    if(h.fc_date)ev.push({d:h.fc_date,t:"fc",n:h.name,pos:"one",past:1});
    span(h.sub,"sub",P);
    if(h.listing)ev.push({d:h.listing,t:"list",n:h.name,pos:"one",past:1,lab:h.open&&h.price?`${h.name} ${sgn(h.open/h.price-1,0)}`:null})});
  // 철회 종목: 철회일 표시 + 원래 일정은 취소선으로 남김

    span(w.forecast,"fc",P);span(w.subscription,"sub",P);if(w.listing)ev.push({d:w.listing,t:"list",n:w.name,pos:"one"});

function q(s){if(!s)return null;const y=s.slice(2,4),m=+s.slice(5,7);return `${y}.${Math.ceil(m/3)}Q`}
function barChart(id,data,fmtV,unit){
  const W=560,H=220,P={l:44,r:8,t:10,b:28},mx=Math.max(...data.map(d=>d.v))*1.1||1,bw=(W-P.l-P.r)/data.length;
  const yt=[0,.25,.5,.75,1].map(f=>f*mx);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
  yt.forEach(v=>{const yy=P.t+(H-P.t-P.b)*(1-v/mx);s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${P.l-6}" y="${yy+4}" text-anchor="end">${fmtV(v)}</text>`});
  data.forEach((d,i)=>{const h=(H-P.t-P.b)*d.v/mx,x=P.l+i*bw+bw*.18,w=bw*.64,y=H-P.b-h;
    s+=`<path d="M${x},${H-P.b}V${y+Math.min(4,h)}q0,-4 4,-4h${w-8}q4,0 4,4V${H-P.b}Z" fill="var(--accent)"/>`+
       `<rect x="${P.l+i*bw}" y="${P.t}" width="${bw}" height="${H-P.t-P.b}" fill="transparent" data-tip="${d.k}: ${fmtV(d.v)}${unit} (${d.n}건)"/>`+
       `<text x="${x+w/2}" y="${H-P.b+16}" text-anchor="middle">${d.k}</text>`});
  return s+`<line x1="${P.l}" x2="${W-P.r}" y1="${H-P.b}" y2="${H-P.b}" stroke="var(--ink3)"/></svg>`;
}
function rDem(){

  const ks=Object.keys(g).sort();

  const c1=ks.map(k=>({k,v:avg(g[k],r=>r.inst_competition)||0,n:g[k].filter(r=>r.inst_competition).length}));

  <div class="card"><table><thead><tr>${cols.map(([c,l])=>`<th data-c="${c}">${l}${dsort[0]===c?(dsort[1]>0?" ↑":" ↓"):""}</th>`).join("")}</tr></thead><tbody>
  ${sorted.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.listing||"–"}</td><td>${fmt(r.inst_competition,1)}</td><td>${fmt(r.amount_eok)}</td><td>${fmt(r.inst_count)}</td><td>${fmt(r.am_count)}</td><td>${pct(r.am_part_ratio)}</td><td>${pct(r.am_lock_ratio)}</td><td>${pct(r.lock_ratio_38)}</td></tr>`).join("")}</tbody></table></div>`;
  document.querySelectorAll("th[data-c]").forEach(th=>th.onclick=()=>{const c=th.dataset.c;dsort=[c,dsort[0]===c?-dsort[1]:-1];rDem()});
  tips();
}

   <div class="card" style="overflow-x:auto"><table><thead><tr><th>상장일</th><th class="l">종목</th><th>상장 전 예측</th><th>실제 시초</th><th>80% 범위</th><th>모델</th></tr></thead><tbody>
    ${(O.rows||[]).map(r=>`<tr><td>${esc(r.listing)}</td><td class="l">${esc(r.name)}</td><td>${sgn(r.pred,0)}</td><td>${res(r)}</td><td>${inr(r)}</td><td class="meta">${esc(r.ver)}</td></tr>`).join("")||'<tr><td colspan="6" class="l mute">기록 없음</td></tr>'}</tbody></table></div>
   <div class="card" style="overflow-x:auto"><table><thead><tr><th>수요예측</th><th class="l">종목</th><th>하단 이하 가능성</th><th>실제</th><th>모델</th></tr></thead><tbody>
    ${(B.rows||[]).map(r=>`<tr><td>${esc(r.fc)}</td><td class="l">${esc(r.name)}</td><td>${Math.round(r.low*100)}%</td><td>${bres(r)}</td><td class="meta">${esc(r.ver)}</td></tr>`).join("")||'<tr><td colspan="5" class="l mute">기록 없음</td></tr>'}</tbody></table></div></div>
  <div class="card" style="margin-top:12px;overflow-x:auto"><h3>모델 변경 기록</h3><table><thead><tr><th>날짜</th><th>모델</th><th class="l">변경</th><th class="l">이유</th><th class="l">확인</th></tr></thead><tbody>
   ${(T.changes||[]).slice().reverse().map(c=>`<tr><td>${esc(c.date)}</td><td>${esc(c.model)}</td><td class="l" style="white-space:normal;min-width:180px">${esc(c.change)}</td><td class="l" style="white-space:normal;min-width:160px">${esc(c.why)}</td><td class="l meta" style="white-space:normal;min-width:160px">${esc(c.check)}</td></tr>`).join("")}</tbody></table>
   <p class="meta" style="margin:8px 4px 0">변경 규칙: 분기에 한 번 이하(실전 '주의'·데이터 오류는 예외). 한 건의 큰 오차로는 고치지 않음. 입력 추가는 성적이 뚜렷이 좋아질 때만, 제거는 빼도 나빠지지 않으면. 바꿀 때마다 모델 버전을 올려 버전별 실전 성적을 따로 봄.</p></div>`;
}
let qf={mk:"전체",bio:true,open:null,sort:"ipo"};
function rPost(){
  const P=D.post_ipo;if(!P){$("#main").innerHTML='<div class="card mute">다음 수집 때부터 표시됩니다</div>';return}
  const key=qf.sort==="ipo"?"gap_ipo":"gap_now";
  const R=(P.rows||[]).filter(r=>(qf.mk==="전체"||r.market===qf.mk)&&(qf.bio||!r.bio))
    .sort((a,b)=>(a[key]??9)-(b[key]??9));
  const sk=Object.entries(P.skipped||{}).filter(([k,v])=>v).map(([k,v])=>`${k} ${v}`).join(", ");
  const c1=R.filter(r=>r.gap_ipo!=null&&r.gap_ipo<=-0.3).length,c2=R.filter(r=>r.gap_now!=null&&r.gap_now<=-0.3).length;
  const gap=v=>v==null?"–":`<b class="${v<0?"neg":"pos"}">${sgn(v,0)}</b>`;
  $("#main").innerHTML=`<div class="bar">${["전체","코스닥","유가증권"].map(m=>`<button class="btn ${qf.mk===m?"pri":""}" data-mk="${m}">${m==="유가증권"?"코스피":m}</button>`).join("")}
   <label class="meta" style="margin-left:8px"><input type="checkbox" id="pbio" ${qf.bio?"checked":""}> 바이오 포함</label>
   <span class="meta" style="margin-left:8px">정렬</span>${[["ipo","상장 때 적정가 기준"],["now","재계산 적정가 기준"]].map(([k,l])=>`<button class="btn ${qf.sort===k?"pri":""}" data-sort="${k}">${l}</button>`).join("")}
   <span class="meta">${P.asof} 기준 · 상장 2년 안 ${fmt(P.universe)}종목 중 흑자 ${fmt((P.rows||[]).length)}종목 · 현재가가 적정가보다 30% 이상 낮은 종목: 상장 때 기준 ${c1}개, 재계산 기준 ${c2}개</span></div>
  <div class="card" style="overflow-x:auto"><table><thead><tr><th class="l" rowspan="2">종목 · 상장일</th><th rowspan="2">시총</th><th rowspan="2">현재가</th><th rowspan="2">공모가 대비</th>
   <th colspan="2" style="border-bottom:0">당사 적정가 (상장 때)</th><th colspan="3" style="border-bottom:0">재계산 적정가 (최근 실적 × 비교기업 현재 배수)</th><th rowspan="2">다음 보호예수 해제</th></tr>
   <tr><th>적정가</th><th>적정가 대비 현재가</th><th>적정가</th><th>적정가 대비 현재가</th><th>현재 배수 / 비교기업</th></tr></thead><tbody>
  ${R.map(r=>{const lk=r.lockup_next;return`<tr class="click" data-pi="${esc(r.code)}"><td class="l"><b>${esc(r.name)}</b>${r.est_at_ipo?' <span class="tag">추정이익으로 상장</span>':""}${r.bio?' <span class="tag">바이오</span>':""}<br><span class="meta">${esc(r.listing.slice(2).replace(/-/g,"."))} 상장</span></td>
   <td>${fmt(r.mcap_eok)}억</td><td>${fmt(r.price)}</td><td class="${(r.ret_fp||0)>=0?"pos":"neg"}">${r.ret_fp!=null?sgn(r.ret_fp,0):"–"}</td>
   <td>${r.ours_ipo_adj?fmt(r.ours_ipo_adj):"–"}${r.ours_kind==="approx"?`<br><span class="meta" title="사이트 운영 전 상장 종목: 주관사 평가가액에 당사 할인율 규칙을 적용한 근사값">근사</span>`:""}${r.adj&&r.adj<0.999?`<br><span class="meta" title="상장 후 무상증자·분할 반영">수정 환산</span>`:""}</td><td>${gap(r.gap_ipo)}</td>
   <td>${fmt(r.fair)}</td><td>${gap(r.gap_now)}</td>
   <td>${esc(r.method)} ${r.mult_now!=null?r.mult_now.toFixed(1)+"배":"–"}<br><span class="meta" ${r.n_peers<=1?'style="color:var(--warn)" title="비교기업이 1곳만 남아 신뢰도 낮음"':""}>비교 ${r.peer_mult.toFixed(1)}배 · ${r.n_peers}곳${r.n_peers<=1?" · 신뢰도 낮음":""}</span></td>
   <td>${lk?`${esc(lk.date.slice(5).replace("-","."))} ${esc(lk.period||"")}<br><span class="meta">${lk.ratio!=null?pct(lk.ratio,1):""}</span>`:"–"}</td></tr>
   ${qf.open===r.code?`<tr><td colspan="10" class="l" style="white-space:normal;background:var(--bg2,#f6f6f3)"><span class="meta">최근 4분기 순이익 ${fmt(r.ni_eok)}억원(${esc(r.fin_basis||"")}) · 재계산에 쓴 신고서 비교기업 현재 ${esc(r.method)}${r.method!==r.ua_method&&r.ua_method?` (상장 때 ${esc(r.ua_method)})`:""}:</span> ${r.peers.map(x=>`${esc(x.name)} ${x.m!=null?x.m.toFixed(1)+"배":"산출 불가"}${x.kept?"":` (제외${x.why?": "+esc(x.why):""})`}`).join(" · ")}</td></tr>`:""}`}).join("")||'<tr><td colspan="10" class="l mute">대상 종목이 없습니다</td></tr>'}
  </tbody></table>
  <p class="meta" style="margin:8px 4px 0">'적정가 대비 현재가' = 현재가 ÷ 적정가 − 1. 음수(파랑)면 현재가가 적정가보다 낮음(싸다), 양수(빨강)면 높음.
  당사 적정가(상장 때) = 상장 시점에 낸 당사 적정가. 사이트 운영 전 상장 종목은 주관사 평가가액에 당사 할인율 규칙을 적용한 근사값('근사')이고, 상장 후 무상증자·분할은 반영해 환산함.
  재계산 적정가 = 증권신고서 비교기업의 현재 배수 단순평균 × 최근 4개 분기 실적 ÷ 현재 주식수. 비교기업 배수는 직전 61거래일 평균 주가 기준이며, 적자·상한 초과(PER 50배, 그 외 100배)와 최고 배수가 나머지 중앙값의 1.5배 이상으로 튀는 1곳은 제외함. 상장 때 이익이 없던 종목은 지금 흑자면 PER로 평가함. 재계산은 사흘마다, 주가는 매 갱신마다 반영.
  상장 후 1·3·6개월 보호예수 해제 물량이 나오면 주가가 눌리는 경향이 있어 다음 해제일을 함께 표시함. 참고용이며 매수 추천이 아님.
  과거 검증(2023.12~2025.6 상장, 6개월 보호예수 해제 직후 그 시점 재계산 적정가 기준, 흑자 25곳): 6개월 보유 시 코스닥 대비 중앙 -29%, 싼 1/3과 비싼 1/3의 차이 없음.${sk?` 제외: ${esc(sk)}.`:""}</p></div>`;
  $("#main").querySelectorAll("[data-mk]").forEach(b=>b.onclick=()=>{qf.mk=b.dataset.mk;rPost()});
  $("#main").querySelectorAll("[data-sort]").forEach(b=>b.onclick=()=>{qf.sort=b.dataset.sort;rPost()});
  $("#pbio").onchange=e=>{qf.bio=e.target.checked;rPost()};
  $("#main").querySelectorAll("[data-pi]").forEach(t=>t.onclick=()=>{qf.open=qf.open===t.dataset.pi?null:t.dataset.pi;rPost()});
}
load();
</script>
